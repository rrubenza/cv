# Journal abbreviations, used when custom_abbreviations = true in config.toml.
#
# [journals] keys are journal names exactly as ADS has them (plain text, "&" not
# "\&"); values are what to print instead (LaTeX). A numbered meeting such as
# "American Astronomical Society Meeting Abstracts #243" uses the entry without
# the number and keeps it ("AAS Meeting Abstracts \#243"). [bibstems] matches by
# ADS's journal code instead, for venues whose name changes with every volume
# (e.g. each SPIE proceedings volume has its own title). Anything not listed
# keeps its full name. Changes take effect on the next update_pubs.py run.
#
# The journal list starts from the journal macros in AASTeX 6.3.1
# (aastex631.cls, e.g. \aj -> AJ), with names checked against ADS.

[journals]
# --- From AASTeX ---
"The Astronomical Journal" = "AJ"
"The Planetary Science Journal" = "PSJ"
"Annual Review of Astronomy and Astrophysics" = 'ARA\&A'
"The Astrophysical Journal" = "ApJ"
"The Astrophysical Journal Letters" = "ApJL"
"The Astrophysical Journal Supplement Series" = "ApJS"
"Applied Optics" = "ApOpt"
"Astrophysics and Space Science" = 'Ap\&SS'
"Astronomy and Astrophysics" = 'A\&A'
"Astronomy and Astrophysics Review" = 'A\&A~Rv'
"Astronomy and Astrophysics Supplement Series" = 'A\&AS'
"Astronomicheskii Zhurnal" = "AZh"
"Bulletin of the American Astronomical Society" = "BAAS"
"Icarus" = "Icarus"
